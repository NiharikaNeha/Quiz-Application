<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Linking CSS File -->
    <link rel="stylesheet" href="style.css" />

    <title>Quiz Application</title>
  </head>
  <body>
    <div class="quiz-section">
      <div id="quiz">
        <!-- Image -->
        <img src="./images/quiz.jpg" alt="quizImg" />

        <!-- Heading -->
        <h2 id="heading">Ready To Play The Quiz!</h2>

        <!-- Question representation -->
        <h2 class="question" id="question">Quiz Question</h2>

        <!-- List -->
        <ul>
          <li>
            <input type="radio" name="answer" class="answer" id="a" />
            <label for="a" class="option-1">Quiz Option</label>
          </li>
          <li>
            <input type="radio" name="answer" class="answer" id="b" />
            <label for="b" class="option-2">Quiz Option</label>
          </li>
          <li>
            <input type="radio" name="answer" class="answer" id="c" />
            <label for="c" class="option-3">Quiz Option</label>
          </li>
          <li>
            <input type="radio" name="answer" class="answer" id="d" />
            <label for="d" class="option-4">Quiz Option</label>
          </li>
        </ul>

        <!-- Submit Btn -->
        <button type="submit" id="btn">Submit</button>
      </div>
    </div>

    <!-- Linking JavaScript File -->
    <script type="module" src="./script.js"></script>
    <script src="./data/data.js"></script>
  </body>
</html>
